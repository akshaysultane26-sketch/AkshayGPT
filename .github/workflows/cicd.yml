name: AkshayGPT CICD

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'

jobs:
  continuous-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Lint check (placeholder)
        run: echo "CI checks passed"

  build-and-push:
    needs: continuous-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Clean up old Docker data
        run: docker system prune -a -f --volumes

      - name: Pull and run container
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.IMAGE_NAME }}:latest
          docker stop akshaygpt || true
          docker rm akshaygpt || true
          docker run -d --pull always --name akshaygpt -p 8080:8080 \
            -e GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }} \
            -e GEMINI_MODEL=${{ secrets.GEMINI_MODEL }} \
            -e LANGSMITH_TRACING=${{ secrets.LANGSMITH_TRACING }} \
            -e LANGSMITH_ENDPOINT=${{ secrets.LANGSMITH_ENDPOINT }} \
            -e LANGSMITH_API_KEY=${{ secrets.LANGSMITH_API_KEY }} \
            -e LANGSMITH_PROJECT=${{ secrets.LANGSMITH_PROJECT }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.IMAGE_NAME }}:latest